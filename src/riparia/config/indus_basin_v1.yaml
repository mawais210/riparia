  B:
    name: "Pakistan (Downstream Riparian)"
    batna: 45.0
    weights:
      upstream_storage_capacity: 0.05
      filling_window: 0.08
      allocation_mechanism: 0.13
      data_exchange: 0.06
      flood_early_warning: 0.07
      financing_transfer: 0.08
      irrigation_reliability: 0.15
      low_season_volume: 0.08
      shortfall_penalty: 0.05
      agricultural_income: 0.18
      agricultural_labor: 0.07
    issue_scores:
      upstream_storage_capacity: {none: 100, small: 68, medium: 38, large: 8}
      filling_window: {wet_season: 100, shoulder: 68, low_season: 35, unrestricted: 10}
      allocation_mechanism: {fixed_high: 100, zonal_formula: 80, adaptive_rule_curve: 55, percentage_of_flow: 45, fixed_low: 10}
      data_exchange: {none: 8, monthly: 55, weekly: 80, daily_verified: 100}
      flood_early_warning: {none: 8, seasonal: 58, real_time: 100}
      financing_transfer: {b_pays_a: 8, none: 55, a_pays_b: 100, joint_fund: 75}
    outcome_terms:
      irrigation_reliability:
        source: irrigation_reliability_fraction
        norm_min: 0
        norm_max: 1
      low_season_volume:
        source: low_season_volume_mcm
        norm_min: 0
        norm_max: 55000
      shortfall_penalty:
        source: shortfall_fraction
        norm_min: 0
