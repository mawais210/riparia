      filling_window: {wet_season: 35, shoulder: 60, low_season: 85, unrestricted: 100}
      allocation_mechanism: {fixed_low: 95, percentage_of_flow: 55, adaptive_rule_curve: 65, zonal_formula: 70, fixed_high: 15}
